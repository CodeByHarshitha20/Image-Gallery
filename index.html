<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - Task 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Image Gallery</h1>
    <p class="subtitle">Image Gallery</p>
    <!-- Filter Buttons -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
        <button class="filter-btn" data-filter="food">Food</button>
    </div>
    <!-- Gallery -->
    <div class="gallery" id="gallery">
        <div class="gallery-item" data-category="nature">
            <img src="Mountain River.png" alt="Mountain River">
            <div class="caption">Mountain River</div>
        </div>
        <div class="gallery-item" data-category="city">
            <img src="City Skyline.png" alt="City Skyline">
            <div class="caption">City Skyline</div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="Dog.png" alt="Dog">
            <div class="caption">Cute Dog</div>
        </div>
        <div class="gallery-item" data-category="food">
            <img src="Food Plate.png" alt="Food Plate">
            <div class="caption">Tasty Meal</div>
        </div>
        <div class="gallery-item" data-category="nature">
            <img src="Forest.png" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>
        <div class="gallery-item" data-category="city">
            <img src="Street.png" alt="Street">
            <div class="caption">Night Street</div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="Deer.png" alt="Deer">
            <div class="caption">Wild Deer</div>
        </div>
        <div class="gallery-item" data-category="food">
            <img src="Fruits.png" alt="Fruits">
            <div class="caption">Fresh Fruits</div>
        </div>
    </div>
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">&times;</button>
        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
